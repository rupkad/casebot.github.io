<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Training Bot</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: #1e293b;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.7rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 28px;
    }

    .info {
      background: #0f172a;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 28px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    #endBtn {
      width: 100%;
      padding: 16px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    #endBtn:hover {
      background: #dc2626;
    }

    .hint {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 24px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sales Training Bot</h1>
    <p class="subtitle">Russian Cold Call Practice</p>

    <div class="info">
      1. Click the round button in the <strong>bottom-right corner</strong> to start the call.<br><br>
      2. When you want to finish, click the red button below.
    </div>

    <button id="endBtn" onclick="endCall()">End Call</button>

    <p class="hint">
      After ending the call, the transcript will appear in<br>
      Vapi Dashboard → Calls
    </p>
  </div>

  <script>
    // ==============================
    //   PASTE YOUR KEYS HERE
    // ==============================
    const PUBLIC_KEY = "ee1409e8-23fc-49de-92e3-44d87fd4b0a9";
    const ASSISTANT_ID = "ffde03c1-b7cd-4523-b7fc-e70bd79f2521";
    // ==============================

    function endCall() {
      // Fully stops the call by reloading the page
      location.reload();
    }

    (function (d, t) {
      var g = document.createElement(t),
          s = d.getElementsByTagName(t)[0];
      g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
      g.defer = true;
      g.async = true;
      s.parentNode.insertBefore(g, s);

      g.onload = function () {
        window.vapiSDK.run({
          apiKey: PUBLIC_KEY,
          assistant: ASSISTANT_ID
        });
      };
    })(document, "script");
  </script>
</body>
</html>
